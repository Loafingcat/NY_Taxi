name: NY Taxi MLOps CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-train-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall .

      - name: Validate training data
        run: |
          python scripts/validate_training_data.py

      - name: Train model smoke test
        run: |
          python -m ml.train --sample

      - name: Check model quality gate
        run: |
          python scripts/check_model_quality.py

      - name: Run tests
        run: |
          pytest

      - name: Check model artifacts
        run: |
          test -f ml/models/fare_model.pkl
          test -f ml/models/production_model.pkl
          test -f ml/metrics/metrics.json
          test -f ml/registry/model_registry.json

      - name: Show metrics
        run: |
          cat ml/metrics/metrics.json

      - name: Upload model report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-quality-report
          path: |
            ml/metrics/metrics.json
            ml/registry/model_registry.json

      - name: Validate Docker Compose config
        run: |
          docker compose config

      - name: Build API Docker image
        run: |
          docker build -f Dockerfile.api -t ny-taxi-api:test .

      - name: Build Streamlit Docker image
        run: |
          docker build -f Dockerfile.streamlit -t ny-taxi-dashboard:test .

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -f Dockerfile.api -t ghcr.io/${{ github.repository_owner }}/ny-taxi-api:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/ny-taxi-api:${{ github.sha }}

      - name: Push Streamlit image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -f Dockerfile.streamlit -t ghcr.io/${{ github.repository_owner }}/ny-taxi-dashboard:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/ny-taxi-dashboard:${{ github.sha }}