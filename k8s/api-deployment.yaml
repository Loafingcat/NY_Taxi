apiVersion: apps/v1
kind: Deployment
metadata:
  name: ny-taxi-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ny-taxi-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ny-taxi-api
    spec:
      containers:
        - name: ny-taxi-api
          image: ghcr.io/loafingcat/ny-taxi-api:023d4c03f1ef1c51ba6ac70d0e5f392f08aa951a
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3