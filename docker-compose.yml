services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: ny_taxi_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: ny_taxi_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ny_taxi_zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  spark-master:
    image: apache/spark:3.5.3
    container_name: ny_taxi_spark_master
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
      --host 0.0.0.0
      --port 7077
      --webui-port 8080
    ports:
      - "7077:7077"
      - "8080:8080"

  spark-worker:
    image: apache/spark:3.5.3
    container_name: ny_taxi_spark_worker
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --cores 4
      --memory 8G
      --webui-port 8081
    depends_on:
      - spark-master
    ports:
      - "8081:8081"

  postgres:
    image: postgres:16
    container_name: ny_taxi_postgres
    environment:
      POSTGRES_DB: nytaxi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ny_taxi_api
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models
      - ./ml/metrics:/app/ml/metrics
      - ./ml/registry:/app/ml/registry
      - ./output:/app/output
      - ./data:/app/data
    depends_on:
      - postgres
    environment:
      - MODEL_PATH=/app/ml/models/production_model.pkl


  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: ny_taxi_dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app/dashboard
      - ./ml/metrics:/app/ml/metrics
      - ./ml/registry:/app/ml/registry
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000

volumes:
  postgres_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log: